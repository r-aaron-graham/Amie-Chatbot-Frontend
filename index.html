<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amie - AI Assistant</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />

  <!-- Inline styles for gradient background and transparent chat -->
  <style>
    /* 1) Soothing linear blue gradient for the entire page */
    body {
      background: linear-gradient(135deg, #89cfff 0%, #0056b3 100%) no-repeat
        center center fixed;
      background-size: cover;
    }

    /* 2) Transparent chat container */
    .chat-page {
      background-color: transparent !important;
      box-shadow: none !important;
      border: none;
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
    }

    /* 3) Chat header text in white for better contrast */
    .chat-header h2 {
      color: #fff;
    }

    /* 4) Translucent white overlay for chat window */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.25);
      margin-bottom: 1.5rem;
      min-height: 300px;
    }

    /* 5) Rounded chat message bubbles */
    .chat-message {
      max-width: 70%;
      margin-bottom: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 20px;
      line-height: 1.5;
      font-size: 1rem;
      color: #333;
    }

    /* Assistant bubble */
    .chat-message.assistant {
      background-color: rgba(255, 255, 255, 0.85);
      align-self: flex-start;
    }

    /* User bubble */
    .chat-message.user {
      background-color: rgba(255, 255, 255, 0.65);
      align-self: flex-end;
    }

    /* 6) Buttons */
    .chat-btn.start {
      background-color: #0056b3;
      color: #fff;
    }

    .chat-btn.stop {
      background-color: #ff5a5f;
      color: #fff;
    }

    .chat-btn.reset {
      background-color: #999999;
      color: #fff;
    }

    /* 7) Chat input */
    .chat-input input[type="text"] {
      background-color: #fff;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <nav class="nav-container">
      <div class="logo">
        <h1>Amie</h1>
        <p class="description">Social and emotional learning demo</p>
      </div>
      <!-- Navigation links intentionally omitted -->
    </nav>
  </header>

  <!-- Main Chat Content -->
  <main>
    <div class="chat-page">
      <div class="chat-header">
        <h2>Try a sample question</h2>
        <p>Search three fictional classroom activity cards. Use sample text only.</p>
      </div>
      <p id="sampleQuestions">Try “active listening”, “group roles”, or “weather forecast”.</p>
      <div class="chat-window" id="chatWindow" role="log" aria-label="Demo conversation"></div>
      <form class="chat-input" id="chatForm">
        <input type="text" id="userInput" aria-label="Sample question"
               aria-describedby="sampleQuestions" maxlength="240" required />
        <button type="submit" class="chat-send">Send</button>
        <button type="reset" class="chat-btn reset">Reset</button>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
  <script type="module" src="chat.mjs"></script>
</body>
</html>
